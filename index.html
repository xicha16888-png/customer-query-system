<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ប្រព័ន្ធត្រួតពិនិត្យអតិថិជនឆ្លងប្រព័ន្ធ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
  :root{
    --primary:#2563eb; --danger:#dc2626; --warn:#f59e0b; --ok:#16a34a;
    --bg:#f4f6f9; --card:#ffffff; --border:#e2e8f0; --text:#1e293b; --muted:#64748b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans Khmer','Noto Sans SC',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
  header{text-align:center;margin-bottom:16px;}
  header h1{font-size:22px;margin:0 0 4px;}
  header p{color:var(--muted);font-size:13px;margin:0;}
  .langBar{display:flex;justify-content:center;gap:6px;margin-bottom:18px;}
  .langBtn{padding:5px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:12px;cursor:pointer;color:var(--muted);}
  .langBtn.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;}
  .searchCard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .searchRow{display:flex;gap:10px;flex-wrap:wrap;}
  .searchRow input{flex:1;min-width:140px;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit;}
  .searchRow button{padding:11px 24px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;font-family:inherit;}
  .searchRow button:hover{background:#1d4ed8;}
  .searchRow button:disabled{background:#94a3b8;cursor:not-allowed;}
  .hint{color:var(--muted);font-size:12px;margin-top:8px;}
  #result{margin-top:20px;}
  .banner{border-radius:10px;padding:16px 18px;margin-bottom:16px;font-weight:600;font-size:15px;display:none;}
  .banner.risk{background:#fef2f2;border:1.5px solid var(--danger);color:var(--danger);display:block;}
  .banner.safe{background:#f0fdf4;border:1.5px solid var(--ok);color:var(--ok);display:block;}
  .banner.caution{background:#fffbeb;border:1.5px solid var(--warn);color:#b45309;display:block;}
  .banner.blacklist{background:#7f1d1d;border:2px solid #450a0a;color:#fff;display:block;font-size:17px;animation:pulseAlert 1.2s infinite;}
  .banner.block{background:#dc2626;border:2px solid #7f1d1d;color:#fff;display:block;font-size:16px;}
  @keyframes pulseAlert{0%,100%{box-shadow:0 0 0 0 rgba(127,29,29,.6);}50%{box-shadow:0 0 0 8px rgba(127,29,29,0);}}
  .sysCard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
  .sysCard h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;}
  .badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600;}
  .badge.active{background:#fee2e2;color:var(--danger);}
  .badge.clear{background:#f1f5f9;color:var(--muted);}
  .badge.blacklist{background:#7f1d1d;color:#fff;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;font-size:12px;}
  .status-pill{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;}
  .status-active{background:#fef3c7;color:#b45309;}
  .status-clear{background:#dcfce7;color:#15803d;}
  .status-blacklist{background:#7f1d1d;color:#fff;}
  .status-normal{background:#e2e8f0;color:var(--muted);}
  .status-overdue{background:#dc2626;color:#fff;font-weight:700;}
  .status-unsettled{background:#fde68a;color:#92400e;font-weight:700;}
  tr.row-blacklist{background:#fef2f2;}
  tr.row-unsettled{background:#fffbeb;}
  .matchtype{font-size:11px;color:var(--muted);}
  .empty{color:var(--muted);font-size:13px;padding:6px 0;}
  .unavailable{color:var(--warn);font-size:12px;}
  footer{text-align:center;color:var(--muted);font-size:11px;margin-top:30px;}
  .adminLinkRow{text-align:center;margin-top:10px;}
  .adminLink{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;}
  .adminPanel{max-width:480px;margin:16px auto 0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;display:none;}
  .adminPanel.open{display:block;}
  .adminPanel h4{margin:0 0 12px;font-size:14px;}
  .adminField{margin-bottom:10px;}
  .adminField label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .adminField input[type=text], .adminField select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;}
  .adminField.checkboxRow{display:flex;align-items:center;gap:8px;}
  .adminField.checkboxRow label{margin:0;}
  .adminRowBtns{display:flex;gap:8px;margin-top:12px;}
  .adminRowBtns button{flex:1;padding:9px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;}
  .btnPrimary{background:var(--primary);color:#fff;}
  .btnSecondary{background:#e2e8f0;color:var(--text);}
  .btnDanger{background:#fef2f2;color:var(--danger);border:1px solid var(--danger)!important;}
  .adminMsg{margin-top:10px;font-size:13px;padding:8px 10px;border-radius:6px;display:none;}
  .adminMsg.ok{display:block;background:#f0fdf4;color:var(--ok);}
  .adminMsg.err{display:block;background:#fef2f2;color:var(--danger);}
  .adminDivider{border:none;border-top:1px dashed var(--border);margin:18px 0;}
  .bulkHint{color:var(--muted);font-size:12px;margin:4px 0 10px;line-height:1.6;}
  .bulkLink{background:none;border:none;color:var(--primary);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;}
  .bulkFileRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .bulkFileRow input[type=file]{flex:1;min-width:180px;font-size:12px;}
  .bulkPreview{display:none;margin-top:10px;}
  .bulkPreview.show{display:block;}
  .bulkPreviewMeta{font-size:12px;color:var(--text);margin-bottom:8px;}
  .bulkPreviewMeta b{color:var(--primary);}
  .bulkTableWrap{max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:6px;}
  .bulkTableWrap table{font-size:12px;}
  .bulkTableWrap th,.bulkTableWrap td{padding:5px 6px;white-space:nowrap;}
  .bulkErrList{margin:8px 0 0;padding-left:18px;font-size:11px;color:var(--warn);max-height:100px;overflow:auto;}
</style>
</head>
<body>
<div class="wrap">
  <div class="langBar" id="langBar"></div>
  <header>
    <h1 id="hTitle"></h1>
    <p id="hSubtitle"></p>
  </header>

  <div class="searchCard">
    <div class="searchRow">
      <input id="qName" type="text">
      <input id="qPhone" type="text">
      <input id="qId" type="text">
      <button id="btnSearch" onclick="doSearch()"></button>
    </div>
    <div class="hint" id="hintText"></div>
  </div>

  <div id="result"></div>

  <footer id="footerText"></footer>

  <div class="adminLinkRow">
    <button class="adminLink" onclick="toggleAdmin()">🔒 管理员 / Admin</button>
  </div>

  <div class="adminPanel" id="adminPanel">
    <div id="adminLoginBox">
      <h4>管理员登录</h4>
      <div class="adminField">
        <label>密码</label>
        <input type="password" id="adminPwd" placeholder="请输入管理员密码">
      </div>
      <div class="adminRowBtns">
        <button class="btnPrimary" onclick="adminUnlock()">解锁</button>
      </div>
      <div class="adminMsg" id="adminLoginMsg"></div>
    </div>

    <div id="adminFormBox" style="display:none">
      <h4>手动新增 / 修改客户记录</h4>
      <div class="adminField">
        <label>姓名</label>
        <input type="text" id="aName" placeholder="姓名（大小写不敏感）">
      </div>
      <div class="adminField">
        <label>身份证号（可选，但填了匹配更准）</label>
        <input type="text" id="aIdNumber" placeholder="身份证号">
      </div>
      <div class="adminField">
        <label>性别</label>
        <select id="aGender">
          <option value="">未填写</option>
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </div>
      <div class="adminField">
        <label>备注/状态（例如 end 表示已结清，留空表示仍在还款中）</label>
        <input type="text" id="aStatusRaw" placeholder="留空 = 仍在还款中；填 end = 已结清">
      </div>
      <div class="adminField checkboxRow">
        <input type="checkbox" id="aBlacklist">
        <label for="aBlacklist">加入黑名单（两边都禁止借款）</label>
      </div>
      <div class="adminRowBtns">
        <button class="btnSecondary" onclick="adminLookup()">先查一下是否已存在</button>
        <button class="btnPrimary" onclick="adminUpsert()">保存</button>
      </div>
      <div class="adminRowBtns">
        <button class="btnDanger" onclick="adminDelete()">删除这条记录</button>
      </div>
      <div class="adminMsg" id="adminFormMsg"></div>

      <hr class="adminDivider">

      <h4>批量导入（Excel / CSV）</h4>
      <div class="bulkHint">
        支持 .xlsx / .xls / .csv。表头随意，只要包含"姓名"（必填）即可，另外可选识别：身份证号、性别、备注/状态、黑名单（填 是/true/1 表示是黑名单）。
        同一批次或已有名单中，姓名或身份证号匹配上的记录会被覆盖更新，其余新增。
        <br><button class="bulkLink" onclick="downloadBulkTemplate()">下载模板 CSV</button>
      </div>
      <div class="bulkFileRow">
        <input type="file" id="bulkFile" accept=".xlsx,.xls,.csv" onchange="handleBulkFile(this.files[0])">
      </div>
      <div class="bulkPreview" id="bulkPreview">
        <div class="bulkPreviewMeta" id="bulkPreviewMeta"></div>
        <div class="bulkTableWrap">
          <table id="bulkPreviewTable"></table>
        </div>
        <ul class="bulkErrList" id="bulkErrList" style="display:none"></ul>
        <div class="adminRowBtns">
          <button class="btnPrimary" id="bulkConfirmBtn" onclick="submitBulkImport()">确认导入</button>
          <button class="btnSecondary" onclick="cancelBulkImport()">取消</button>
        </div>
      </div>
      <div class="adminMsg" id="bulkMsg"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

const SRC_STATUS_KEY = { '进行中':'srcActive', '已结清':'srcSettled', '提前结清':'srcEarlySettled', '逾期':'srcOverdue' };

let curLang = localStorage.getItem('cq_lang') || 'km';
function t(key){ return (I18N[curLang] && I18N[curLang][key]) || I18N.km[key] || key; }
function translateSrcStatus(raw){
  const k = SRC_STATUS_KEY[raw];
  return k ? t(k) : (raw || '');
}

function setLang(lang){
  curLang = lang;
  localStorage.setItem('cq_lang', lang);
  document.documentElement.lang = lang;
  renderChrome();
  const resultEl = document.getElementById('result');
  if (resultEl.dataset.hasData === '1' && window._lastData) render(window._lastData);
}

function renderChrome(){
  document.getElementById('hTitle').textContent = t('title');
  document.getElementById('hSubtitle').textContent = t('subtitle');
  document.getElementById('qName').placeholder = t('phName');
  document.getElementById('qPhone').placeholder = t('phPhone');
  document.getElementById('qId').placeholder = t('phId');
  document.getElementById('btnSearch').textContent = t('btnSearch');
  document.getElementById('hintText').textContent = t('hint');
  document.getElementById('footerText').textContent = t('footer');
  const bar = document.getElementById('langBar');
  bar.innerHTML = LANGS.map(l => `<button class="langBtn ${l===curLang?'active':''}" onclick="setLang('${l}')">${LANG_NAMES[l]}</button>`).join('');
}

async function doSearch(){
  const name = document.getElementById('qName').value.trim();
  const phone = document.getElementById('qPhone').value.trim();
  const idNumber = document.getElementById('qId').value.trim();
  const btn = document.getElementById('btnSearch');
  const resultEl = document.getElementById('result');
  if(!name && !phone && !idNumber){
    resultEl.innerHTML = `<div class="banner risk" style="display:block">${esc(t('errNoInput'))}</div>`;
    return;
  }
  btn.disabled = true; btn.textContent = t('btnSearching');
  resultEl.innerHTML = `<div class="empty">${esc(t('btnSearching'))}</div>`;
  try{
    const params = new URLSearchParams();
    if(name) params.set('name', name);
    if(phone) params.set('phone', phone);
    if(idNumber) params.set('idNumber', idNumber);
    const res = await fetch(`${API_BASE}/api/check?${params.toString()}`);
    const data = await res.json();
    if(!data.ok){ resultEl.innerHTML = `<div class="banner risk" style="display:block">${esc(t('errFail'))}${esc(data.error||'')}</div>`; return; }
    window._lastData = data;
    resultEl.dataset.hasData = '1';
    render(data);
  }catch(e){
    resultEl.innerHTML = `<div class="banner risk" style="display:block">${esc(t('errFail'))}${esc(e.message)}</div>`;
  }finally{
    btn.disabled = false; btn.textContent = t('btnSearch');
  }
}

function esc(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(data){
  const resultEl = document.getElementById('result');
  let html = '';

  if(data.blacklistRisk){
    html += `<div class="banner blacklist">${esc(t('bannerBlacklist'))}</div>`;
  } else {
    if(data.blockMorodok){
      html += `<div class="banner block">${esc(t('bannerBlockMorodok'))}</div>`;
    }
    if(data.blockPawn){
      html += `<div class="banner block">${esc(t('bannerBlockPawn'))}</div>`;
    }
  }

  if(!data.blacklistRisk && !data.blockMorodok && !data.blockPawn){
    if(data.crossRisk){
      html += `<div class="banner risk">${esc(t('bannerCrossRisk'))}</div>`;
    } else if(data.morodok.hasActive || data.pawn.hasActive){
      html += `<div class="banner caution">${esc(t('bannerOneActive'))}</div>`;
    } else if(data.morodok.matches.length===0 && data.pawn.matches.length===0 && data.legacy.matches.length===0){
      html += `<div class="banner safe">${esc(t('bannerNone'))}</div>`;
    } else {
      html += `<div class="banner safe">${esc(t('bannerClear'))}</div>`;
    }
  }

  html += renderSysCard(t('sysMorodok'), data.morodok);
  html += renderSysCard(t('sysPawn'), data.pawn);
  html += renderLegacyCard(data.legacy);

  resultEl.innerHTML = html;
}

function renderSysCard(title, sys){
  let inner = '';
  if(!sys.available){
    inner = `<div class="unavailable">${esc(t('unavailable'))}</div>`;
  } else if(sys.matches.length===0){
    inner = `<div class="empty">${esc(t('empty'))}</div>`;
  } else {
    inner = `<table><thead><tr>
      <th>${esc(t('thCustomer'))}</th><th>${esc(t('thPhone'))}</th><th>${esc(t('thStatus'))}</th><th>${esc(t('thAmount'))}</th><th>${esc(t('thDate'))}</th><th>${esc(t('thModelShop'))}</th><th>${esc(t('thMatch'))}</th>
    </tr></thead><tbody>`;
    sys.matches.forEach(m => {
      let pill;
      if(m.isOverdue){
        const odLabel = t('overdueDaysLabel').replace('{days}', m.overdueDays);
        pill = `<span class="status-pill status-overdue">${esc(odLabel)}</span>`;
      } else {
        const label = translateSrcStatus(m.status) || m.status || (m.active ? t('srcActive') : t('srcSettled'));
        pill = m.active ? `<span class="status-pill status-active">${esc(label)}</span>` : `<span class="status-pill status-clear">${esc(label)}</span>`;
      }
      const matchLabel = m.matchType==='phone'?t('matchPhone'):m.matchType==='id'?t('matchId'):t('matchName');
      inner += `<tr>
        <td>${esc(m.customer)}</td>
        <td>${esc(m.phone)}${m.idNumber?`<br><span class="matchtype">${esc(t('thIdNumber'))}:${esc(m.idNumber)}</span>`:''}</td>
        <td>${pill}</td>
        <td>$${esc(m.amount)}</td>
        <td>${esc(m.date)}</td>
        <td>${esc(m.model)} ${esc(m.shop)}</td>
        <td class="matchtype">${matchLabel}</td>
      </tr>`;
    });
    inner += '</tbody></table>';
  }
  let badge = '';
  if(sys.available){
    if(sys.hasOverdue) badge = `<span class="badge active">${esc(t('badgeOverdue'))}</span>`;
    else if(sys.hasActive) badge = `<span class="badge active">${esc(t('badgeActive'))}</span>`;
    else badge = `<span class="badge clear">${esc(t('badgeClear'))}</span>`;
  }
  return `<div class="sysCard"><h3>${esc(title)} ${badge}</h3>${inner}</div>`;
}

function renderLegacyCard(legacy){
  let inner = '';
  const title = t('legacyLabel').replace('{count}', legacy.count ?? '');
  const hasBlacklistMatch = (legacy.matches||[]).some(m => m.isBlacklist);
  const hasUnsettledMatch = (legacy.matches||[]).some(m => !m.isBlacklist && m.isSettled === false);
  if(!legacy.available){
    inner = `<div class="unavailable">${esc(t('legacyUnavailable'))}</div>`;
  } else if(legacy.matches.length===0){
    inner = `<div class="empty">${esc(t('empty'))}</div>`;
  } else {
    inner = `<table><thead><tr><th>${esc(t('thName'))}</th><th>${esc(t('thIdNumber'))}</th><th>${esc(t('thGender'))}</th><th>${esc(t('thHistStatus'))}</th><th>${esc(t('thMatch'))}</th></tr></thead><tbody>`;
    legacy.matches.forEach(m => {
      let rowCls = '', pillCls = '', label = '';
      if(m.isBlacklist){
        rowCls = 'row-blacklist'; pillCls = 'status-blacklist'; label = t('blacklistYes');
      } else if(m.isSettled === false){
        rowCls = 'row-unsettled'; pillCls = 'status-unsettled'; label = t('legacyUnsettled');
      } else {
        pillCls = 'status-clear'; label = t('legacySettled');
      }
      const matchLabel = m.matchType==='id'?t('matchId'):t('matchName');
      inner += `<tr class="${rowCls}">
        <td>${esc(m.customer)}</td>
        <td>${esc(m.idNumber)}</td>
        <td>${esc(m.gender)}</td>
        <td><span class="status-pill ${pillCls}">${esc(label)}</span></td>
        <td class="matchtype">${matchLabel}</td>
      </tr>`;
    });
    inner += '</tbody></table>';
  }
  let badge = '';
  if(hasBlacklistMatch) badge = `<span class="badge blacklist">${esc(t('badgeBlacklist'))}</span>`;
  else if(hasUnsettledMatch) badge = `<span class="badge active">${esc(t('badgeActive'))}</span>`;
  return `<div class="sysCard"><h3>${esc(title)} ${badge}</h3>${inner}</div>`;
}

document.addEventListener('DOMContentLoaded', () => {
  renderChrome();
  ['qName','qPhone','qId'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
  });
});

async function adminUpsert(){
  const name = document.getElementById('aName').value.trim();
  const idNumber = document.getElementById('aIdNumber').value.trim();

    const res = await fetch(`${API_BASE}/api/admin/upsert`, {

  msgEl.className = 'adminMsg'; msgEl.textContent = '删除中...';
  try{
    const res = await fetch(`${API_BASE}/api/admin/delete`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},

  }catch(e){
    msgEl.className = 'adminMsg err'; msgEl.textContent = '删除失败：' + e.message;
  }
}

  const map = {};
  headers.forEach(h => {
    const nh = _bulkNorm(h);
    for (const field in BULK_FIELD_ALIASES) {
      if (map[field]) continue;
      if (BULK_FIELD_ALIASES[field].some(a => _bulkNorm(a) === nh)) {
        map[field] = h;
      }
    }
  });
  return map;
}

function bulkRowToRecord(row, fieldMap){
  const get = (field) => fieldMap[field] !== undefined ? row[fieldMap[field]] : '';
  const name = (get('name') || '').toString().trim();
  const idNumber = (get('idNumber') || '').toString().trim();
  const gender = (get('gender') || '').toString().trim();
  const statusRaw = (get('statusRaw') || '').toString().trim();
  const blRaw = _bulkNorm(get('isBlacklist'));
  const isBlacklist = ['是','true','1','yes','y','黑名单','黑'].includes(blRaw);
  return { name, idNumber, gender, statusRaw, isBlacklist };
}

function handleBulkFile(file){
  const msgEl = document.getElementById('bulkMsg');
  msgEl.className = 'adminMsg'; msgEl.textContent = '';
  cancelBulkImport(false);
  if (!file) return;
  if (typeof XLSX === 'undefined') {
    msgEl.className = 'adminMsg err'; msgEl.textContent = '解析库未加载成功，请检查网络后刷新页面重试。';
    return;
  }

  const reader = new FileReader();
  reader.onerror = () => {
    msgEl.className = 'adminMsg err'; msgEl.textContent = '读取文件失败，请重试。';
  };
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
      if (!rows.length) {
        msgEl.className = 'adminMsg err'; msgEl.textContent = '文件里没有读到数据行。';
        return;
      }
      const fieldMap = buildBulkFieldMap(Object.keys(rows[0]));
      if (!fieldMap.name) {
        msgEl.className = 'adminMsg err';
        msgEl.textContent = '没能识别出"姓名"这一列，请检查表头，或点击"下载模板 CSV"参考格式。';
        return;
      }

      const records = [];
      let skipped = 0;
      rows.forEach(row => {
        const rec = bulkRowToRecord(row, fieldMap);
        if (!rec.name) { skipped++; return; }
        records.push(rec);
      });

      if (!records.length) {
        msgEl.className = 'adminMsg err'; msgEl.textContent = '没有一行有姓名，无法导入。';
        return;
      }

      _bulkRecords = records;
      _bulkSkipped = skipped;
      renderBulkPreview(fieldMap);
    } catch (err) {
      msgEl.className = 'adminMsg err'; msgEl.textContent = '解析文件失败：' + err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderBulkPreview(fieldMap){
  const metaEl = document.getElementById('bulkPreviewMeta');
  const tableEl = document.getElementById('bulkPreviewTable');
  const errListEl = document.getElementById('bulkErrList');

  const cols = ['name','idNumber','gender','statusRaw','isBlacklist'];
  const colLabel = { name:'姓名', idNumber:'身份证号', gender:'性别', statusRaw:'备注/状态', isBlacklist:'黑名单' };
  const recognized = cols.filter(c => fieldMap[c]).map(c => colLabel[c]).join('、');

  let meta = `共识别到 <b>${_bulkRecords.length}</b> 条有效记录`;
  if (_bulkSkipped > 0) meta += `，另有 <b>${_bulkSkipped}</b> 行因缺少姓名被跳过`;
  meta += `。已识别列：${recognized || '（无）'}。`;
  meta += ' 提交后，姓名或身份证号能匹配上已有名单的记录会被覆盖更新，其余作为新记录新增。';
  metaEl.innerHTML = meta;

  const previewRows = _bulkRecords.slice(0, 20);
  let html = '<thead><tr>' + cols.map(c => `<th>${colLabel[c]}</th>`).join('') + '</tr></thead><tbody>';
  previewRows.forEach(r => {
    html += '<tr>' + cols.map(c => {
      const v = c === 'isBlacklist' ? (r[c] ? '是' : '') : (r[c] || '');
      return `<td>${String(v).replace(/</g,'&lt;')}</td>`;
    }).join('') + '</tr>';
  });
  if (_bulkRecords.length > previewRows.length) {
    html += `<tr><td colspan="${cols.length}" style="color:var(--muted)">... 还有 ${_bulkRecords.length - previewRows.length} 条，仅预览前 ${previewRows.length} 条 ...</td></tr>`;
  }
  html += '</tbody>';
  tableEl.innerHTML = html;

  errListEl.style.display = 'none';
  errListEl.innerHTML = '';

  document.getElementById('bulkPreview').classList.add('show');
}

function cancelBulkImport(clearFileInput){
  _bulkRecords = [];
  _bulkSkipped = 0;
  document.getElementById('bulkPreview').classList.remove('show');
  document.getElementById('bulkPreviewTable').innerHTML = '';
  document.getElementById('bulkPreviewMeta').innerHTML = '';
  const msgEl = document.getElementById('bulkMsg');
  msgEl.className = 'adminMsg'; msgEl.textContent = '';
  if (clearFileInput !== false) {
    const fileEl = document.getElementById('bulkFile');
    if (fileEl) fileEl.value = '';
  }
}

async function submitBulkImport(){
  const msgEl = document.getElementById('bulkMsg');
  if (!_bulkRecords.length) {
    msgEl.className = 'adminMsg err'; msgEl.textContent = '没有可提交的记录。';
    return;
  }
  const btn = document.getElementById('bulkConfirmBtn');
  btn.disabled = true;
  msgEl.className = 'adminMsg'; msgEl.textContent = `正在导入 ${_bulkRecords.length} 条，请稍候...`;
  try{
    const res = await fetch(`${API_BASE}/api/admin/bulk-upsert`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: _adminPwd, records: _bulkRecords })
    });
    const data = await res.json();
    if (!data.ok) {
      msgEl.className = 'adminMsg err'; msgEl.textContent = data.error || '导入失败';
      btn.disabled = false;
      return;
    }
    let msg = `✅ 导入完成：新增 ${data.added} 条，更新 ${data.updated} 条`;
    if (data.skipped) msg += `，跳过 ${data.skipped} 条`;
    msg += `，当前共 ${data.total} 条。`;
    if (data.githubCommitted) {
      msg += ' 已自动提交到 GitHub，Render 正在重新部署，1-2分钟后生效。';
    } else {
      msg += ' ⚠️ 未能提交到 GitHub（' + (data.githubError || '未知原因') + '），这次修改重启服务器后会丢失，请检查 GITHUB_TOKEN 配置。';
    }
    msgEl.className = 'adminMsg ok'; msgEl.textContent = msg;

    if (data.errors && data.errors.length) {
      const errListEl = document.getElementById('bulkErrList');
      errListEl.style.display = 'block';
      errListEl.innerHTML = data.errors.map(e => `<li>${String(e).replace(/</g,'&lt;')}</li>`).join('');
    }

    document.getElementById('bulkPreview').classList.remove('show');
    _bulkRecords = [];
    _bulkSkipped = 0;
    document.getElementById('bulkFile').value = '';
  }catch(e){
    msgEl.className = 'adminMsg err'; msgEl.textContent = '导入失败：' + e.message;
  }finally{
    btn.disabled = false;
  }
}
</script>
